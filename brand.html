<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Brand</title>
		<link rel="stylesheet" href="styles.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	</head>
	<body>
		<!-- wrap content so it can grow and push footer down on short pages -->
		<main class="content">
			<div class="header-row">
				<img class="logo" src="resource/logo.svg" alt="Brand logo" width="120" height="36">
				<div class="brand-selector">
					<select id="brand-select" aria-label="Select brand"></select>
				</div>
				<div id="preview-toggle"><i class="material-icons">visibility</i></div>
			</div>
			<section id="logo-files" class="logo-files is-hidden sections" aria-labelledby="logo-files-heading">
				<div class="logo-file-list" id="logo-files-list" role="list"></div>
			</section>
			<table aria-label="Brand colours table" class="sections">
				<thead>
					<tr>
						<th class="serial-column">Serial</th>
						<th>Code</th>
						<th>Colour</th>
						<th>Remark</th>
					</tr>
				</thead>
				<tbody>
					<!-- rows are generated dynamically from data.json.js by script.js -->
				</tbody>
			</table>
			<div id="font-samples" class="sections"></div>
		</main>

		<!-- footer that stays at the bottom when content is short -->
		<footer id='footer-brand' class="site-footer" role="contentinfo"></footer>
		<script src="data/list.json.js"></script>
		<script src="components/brand-colour-row.html.js"></script>
		<script src="components/font-sample.html.js"></script>
		<script src="script.js"></script>
	</body>
</html>
