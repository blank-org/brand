<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Brand</title>
		<link rel="stylesheet" href="styles.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	</head>
	<body>
		<!-- wrap content so it can grow and push footer down on short pages -->
		<main class="content">
			<div class="header-row">
				<svg class="logo" role="img" aria-labelledby="logo-title" viewBox="0 0 120 36">
					<title id="logo-title">Brand</title>
					<text x="0" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="currentColor">brand</text>
				</svg>
				<div class="brand-selector">
					<select id="brand-select" aria-label="Select brand"></select>
				</div>
				<div id="preview-toggle"><i class="material-icons">visibility</i></div>
			</div>
			<table aria-label="Brand colours table">
				<thead>
					<tr>
						<th class="serial-column">Serial</th>
						<th>Code</th>
						<th>Colour</th>
						<th>Remark</th>
					</tr>
				</thead>
				<tbody>
					<!-- rows are generated dynamically from data.json.js by script.js -->
				</tbody>
			</table>
			<div id="font-samples"></div>
		</main>

		<!-- footer that stays at the bottom when content is short -->
		<footer id='footer-brand' class="site-footer" role="contentinfo"></footer>
		<script src="data/list.json.js"></script>
		<script src="components/brand-colour-row.html.js"></script>
		<script src="components/font-sample.html.js"></script>
		<script src="script.js"></script>
	</body>
</html>
