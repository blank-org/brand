<!doctype html>
<html lang="en">

	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Brand</title>
		<link rel="stylesheet" href="styles.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	</head>

	<body class="theme-light">

		<!-- wrap content so it can grow and push footer down on short pages -->
		<main class="content">
			<div class="header-row">
				<img class="logo" src="resource/logo.svg" alt="Brand logo" width="120" height="36">
				<div class="selector-stack">
					<div class="brand-selector">
						<select id="brand-select" aria-label="Select brand"></select>
					</div>
					<div class="theme-selector" id="theme-selector" hidden>
						<select id="theme-select" aria-label="Select theme"></select>
					</div>
				</div>
				<div class="header-actions">
					<button id="index-toggle" class="icon-toggle index-toggle" type="button" aria-label="Show indexes" aria-pressed="false">#</button>
					<div id="preview-toggle" role="button" tabindex="0" aria-pressed="false"><i class="material-icons">visibility</i></div>
					<button id="theme-toggle" class="icon-toggle" type="button" aria-label="Toggle theme" hidden>
						<i class="material-icons" aria-hidden="true">light_mode</i>
					</button>
				</div>
			</div>
			<section id="logo-files" class="logo-files is-hidden sections" aria-labelledby="logo-files-heading">
				<div class="logo-file-list" id="logo-files-list" role="list"></div>
			</section>
			<table aria-label="Brand colours table" class="sections">
				<thead>
					<tr>
						<th>Colour</th>
						<th>Code</th>
						<th>Remark</th>
						<th class="serial-column">Serial</th>
						<th class="colour-row-actions-column" aria-label="Colour row actions"></th>
					</tr>
				</thead>
				<tbody>
					<!-- rows are generated dynamically from data.json.js by script.js -->
				</tbody>
			</table>
			<div id="font-samples" class="sections"></div>
			<section id="icon-comparison" class="icon-comparison sections is-hidden" aria-label="Icon comparison">
				<div id="icon-comparison-list" class="icon-comparison-list"></div>
			</section>
			<div class="footer-actions">
				<button id="save-json" class="icon-toggle save-json-control" type="button" aria-label="Export JSON" title="Export JSON" disabled>
					<i class="material-icons" aria-hidden="true">save_alt</i>
				</button>
			</div>
		</main>

		<!-- footer that stays at the bottom when content is short -->
		<footer id='footer-brand' class="site-footer" role="contentinfo"></footer>

		<script src="data/list.json.js"></script>
		<script src="components/brand-colour-row.html.js"></script>
		<script src="components/font-sample.html.js"></script>
		<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
		<script src="script.js"></script>

	</body>
	
</html>
